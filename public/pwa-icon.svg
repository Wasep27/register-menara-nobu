<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#046249" />
      <stop offset="50%" stop-color="#07936E" />
      <stop offset="100%" stop-color="#0F4A39" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10D5A0" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#ECC94B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10D5A0" stroke-width="3" stroke-opacity="0.3" />

  <!-- Central Emblem / Modern Tower & Geometric "N" Badge -->
  <g filter="url(#dropShadow)">
    <!-- Tower / Shield Silhouette -->
    <!-- Center Tower Column -->
    <path d="M216 110 H296 V390 H216 Z" fill="url(#glowGrad)" rx="8" />
    
    <!-- Left Angled Pillar (Forms Stylized N & Architectural Skyscraper) -->
    <path d="M140 170 H204 V390 H140 Z" fill="#FFFFFF" fill-opacity="0.95" rx="8" />
    <path d="M140 170 L296 350 V390 H240 L140 270 Z" fill="url(#glowGrad)" />

    <!-- Right Tower Pillar -->
    <path d="M308 170 H372 V390 H308 Z" fill="#FFFFFF" fill-opacity="0.95" rx="8" />

    <!-- Digital QR / Signal Beam Indicator at Top -->
    <circle cx="256" cy="74" r="14" fill="#10D5A0" />
    <path d="M228 62 C236 54 246 50 256 50 C266 50 276 54 284 62" fill="none" stroke="#10D5A0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M216 50 C228 38 242 32 256 32 C270 32 284 38 296 50" fill="none" stroke="#10D5A0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.45" />

    <!-- Base Nobu Horizon Line -->
    <rect x="120" y="406" width="272" height="12" rx="6" fill="#10D5A0" />
  </g>
</svg>
